<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATA APPS | Web Portal</title>
    <meta name="description" content="ATA Software Uygulama Portalı">

    <!-- PWA & Mobil Uygulama Ayarları -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATA APPS">
    <meta name="application-name" content="ATA APPS">

    <!-- Mobil Cihaz İkonları (Ana Ekrana Ekleme Logosu) -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="apple-touch-icon-precomposed" href="logo.png">
    <meta name="msapplication-TileImage" content="logo.png">
    <meta name="msapplication-TileColor" content="#2563eb">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== KOYU MOD (VARSAYILAN) ===== */
        :root {
            --bg-color: #0b0f19;
            --bg-secondary: #111827;
            --card-bg: #162032;
            --card-hover: #1f2d47;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f472b6;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --header-bg: rgba(11, 15, 25, 0.92);
            --modal-bg: #162032;
            --input-bg: rgba(0, 0, 0, 0.35);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            --radius: 14px;
        }

        /* ===== AÇIK MOD (BEYAZ TEMA + MAVİ HATLAR) ===== */
        body.light-mode {
            --bg-color: #f4f7fc;
            --bg-secondary: #e2e8f0;
            --card-bg: #ffffff;
            --card-hover: #eef4ff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #ec4899;
            --accent-green: #059669;
            --accent-orange: #ea580c;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(37, 99, 235, 0.22);
            --header-bg: rgba(244, 247, 252, 0.95);
            --modal-bg: #ffffff;
            --input-bg: rgba(37, 99, 235, 0.04);
            --shadow: 0 10px 30px rgba(37, 99, 235, 0.15);
        }

        body.light-mode header {
            border-bottom: 2px solid rgba(37, 99, 235, 0.28);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
        }

        body.light-mode .card {
            border: 1.5px solid rgba(37, 99, 235, 0.22);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
        }

        body.light-mode .card:hover {
            border-color: #2563eb;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.2);
        }

        body.light-mode .search-wrap input {
            border: 1.5px solid rgba(37, 99, 235, 0.28);
            background: #ffffff;
        }

        body.light-mode .search-wrap input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.2);
        }

        body.light-mode footer {
            border-top: 2px solid rgba(37, 99, 235, 0.25);
        }

        body.light-mode .modal {
            border: 2px solid rgba(37, 99, 235, 0.3);
            box-shadow: 0 12px 36px rgba(37, 99, 235, 0.2);
        }

        body.light-mode .btn {
            border-color: rgba(37, 99, 235, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- ÜST BAR (HEADER) --- */
        header {
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            user-select: none;
        }

        .logo-img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.65), 0 0 32px rgba(99, 102, 241, 0.45);
            animation: logoGlow 3s infinite alternate ease-in-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.08);
            box-shadow: 0 0 24px rgba(59, 130, 246, 0.95), 0 0 45px rgba(147, 197, 253, 0.85);
            filter: brightness(1.12);
        }

        @keyframes logoGlow {
            0% {
                box-shadow: 0 0 12px rgba(59, 130, 246, 0.5), 0 0 24px rgba(99, 102, 241, 0.3);
                filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.5));
            }

            50% {
                box-shadow: 0 0 24px rgba(59, 130, 246, 0.9), 0 0 48px rgba(147, 197, 253, 0.75);
                filter: drop-shadow(0 0 14px rgba(59, 130, 246, 0.85));
            }

            100% {
                box-shadow: 0 0 12px rgba(59, 130, 246, 0.5), 0 0 24px rgba(99, 102, 241, 0.3);
                filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.5));
            }
        }

        .auth-logo-img {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            object-fit: cover;
            margin: 0 auto 1.1rem;
            display: block;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.75), 0 0 45px rgba(99, 102, 241, 0.5);
            animation: logoGlow 3s infinite alternate ease-in-out;
        }

        .logo h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Admin Rozeti */
        .admin-badge {
            display: none;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(244, 114, 182, 0.2));
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.35);
            font-size: 0.7rem;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            align-items: center;
            gap: 0.3rem;
        }

        /* Tema Değiştirme Butonu */
        .theme-btn {
            width: 36px;
            height: 36px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            background: var(--card-hover);
            color: var(--primary);
        }

        /* Butonlar */
        .btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--card-hover);
            border-color: var(--primary);
        }

        .btn-add {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .btn-add:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: #fff;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.35);
            padding: 0.45rem 1rem;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            display: none;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* --- ANA İÇERİK --- */
        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 1.25rem 0.85rem;
        }

        /* Arama Kutusu */
        .search-wrap {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .search-wrap input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .search-wrap input::placeholder {
            color: var(--text-muted);
        }

        .search-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Grid (Mobilde Max 4 Kolon) */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        /* Kart Yapısı */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.75rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.22s ease;
            position: relative;
            cursor: pointer;
        }

        .card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.1);
        }

        .card-icon {
            width: 42px;
            height: 42px;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--primary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            width: 100%;
        }

        .card-info h3 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .tag {
            font-size: 0.58rem;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tag.repo {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-green);
        }

        .tag.raw {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary);
        }

        .card-btns {
            display: flex;
            gap: 0.3rem;
            width: 100%;
            margin-top: 0.2rem;
        }

        .btn-launch {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 0.4rem 0.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            transition: opacity 0.2s;
        }

        .btn-launch:hover {
            opacity: 0.88;
        }

        .btn-del {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        /* Sayfalama */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.5rem;
            padding-top: 1rem;
        }

        .page-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: var(--card-hover);
        }

        .page-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* --- IFRAME VIEWER --- */
        .viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .viewer.active {
            display: flex;
        }

        .viewer-bar {
            background: var(--card-bg);
            padding: 0.6rem 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .viewer iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            display: block;
        }

        /* --- MODAL PENCERELER --- */
        .modal-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-bg.active {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 1.75rem 1.5rem;
            box-shadow: var(--shadow);
            animation: popIn 0.25s ease;
            position: relative;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 30px;
            height: 30px;
            background: var(--card-hover);
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        /* Auth Modal İkon ve Başlık */
        .auth-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            margin: 0 auto 1.1rem;
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.4);
        }

        .auth-head {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-head h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .auth-head p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .auth-err {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 0.85rem;
            display: none;
            text-align: center;
        }

        .lockout-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 1.25rem 1rem;
            text-align: center;
            display: none;
            margin-bottom: 0.85rem;
        }

        .lockout-emoji {
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }

        .lockout-msg {
            font-size: 0.82rem;
            color: var(--accent-orange);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .lockout-count {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-orange);
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        /* Form Elemanları */
        .form-group {
            margin-bottom: 0.9rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.88rem;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.1rem;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Option Tabs (Repo / Ham Link) */
        .opt-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            background: var(--input-bg);
            padding: 0.25rem;
            border-radius: 10px;
            margin-bottom: 0.85rem;
        }

        .opt-tab {
            padding: 0.5rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .opt-tab.active {
            background: var(--primary);
            color: #fff;
        }

        .preview-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: var(--accent-green);
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.72rem;
            margin-top: 0.35rem;
            word-break: break-all;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }

        /* Mobil Uyumluluk */
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.4rem;
            }

            .card {
                padding: 0.6rem 0.3rem;
            }

            .card-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .card-info h3 {
                font-size: 0.72rem;
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="ATA APPS Logo" class="logo-img" />
            <h1>ATA APPS</h1>
        </div>

        <div class="header-right">
            <span class="admin-badge" id="adminBadge"><i class="fa-solid fa-shield-halved"></i> ADMİN</span>
            <button class="btn btn-add" id="addSiteBtn"><i class="fa-solid fa-plus"></i> Ekle</button>
            <button class="theme-btn" id="themeBtn" title="Tema Değiştir"><i class="fa-solid fa-moon"></i></button>
            <button class="btn btn-login" id="loginBtn" onclick="openAuthModal()"><i
                    class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="adminLogout()" title="Çıkış Yap"><i
                    class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div class="search-wrap">

    <!-- MODAL 2: LİNK EKLEME -->
    <div class="modal-bg" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-header">
                <h2><i class="fa-solid fa-plus" style="color:var(--primary);"></i> Yeni Site Ekle</h2>
            </div>
            <form id="addForm">
                <div class="form-group">
                    <label>Link Türü</label>
                    <div class="opt-tabs">
                        <div class="opt-tab active" id="optRepo" onclick="setLinkType('repo')"><i
                                class="fa-brands fa-github"></i> Repo Adı</div>
                        <div class="opt-tab" id="optRaw" onclick="setLinkType('raw')"><i class="fa-solid fa-link"></i>
                            Ham Link</div>

                    <label>Repo Adı</label>

                    <label>Ham Link (Tam URL)</label>
                    <input type="url" id="rawInput" class="form-control" placeholder="https://google.com">

                <div class="form-group">
                    <label>Site / Uygulama Adı</label>
                    <input type="text" id="titleInput" class="form-control" placeholder="Örn: Hesap Makinesi" required>

                <div class="form-group">
                    <label>İkon / Emoji (İsteğe Bağlı)</label>
                    <input type="text" id="iconInput" class="form-control" placeholder="🧮 veya fa-calculator">

                    <label>Özel Logo / Resim Linki (İsteğe Bağlı)</label>
                    <input type="url" id="customLogoInput" class="form-control" placeholder="https://site.com/logo.png">
                </div>

                <button type="submit" class="btn btn-login"
                    style="width:100%; padding:0.7rem; font-size:0.9rem; border-radius:10px; margin-top:0.5rem; justify-content:center;">
                    <i class="fa-solid fa-floppy-disk"></i> Kaydet
                </button>

    <script>
        /* ===== SABİTLER ===== */
        const ADMIN_USER = "ATA";
        const ADMIN_PASS = "1881RR";
        const GITHUB_BASE = "https://ata-software.github.io/";
        const MAX_ATTEMPTS = 2;
        const LOCKOUT_SEC = 10 * 60; // 10 dakika

        const JSONBIN_ID = "69c69b77b7ec241ddcad08aa";
        const JSONBIN_KEY = "$2a$10$VSDLnSWsLCzUvBeaYhm9xusbwH6yYilum7HOS0suSMUL96ABhqbMu";
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
        const ITEMS_PER_PAGE = 12;

        const INITIAL_APPS = [
            { id: "1", title: "ATA Software Hub", type: "repo", repoName: "ata-software", url: "https://ata-software.github.io/ata-software/", icon: "🚀", customLogo: "" },
            { id: "2", title: "Hesap Makinesi", type: "repo", repoName: "hesap-makinesi", url: "https://ata-software.github.io/hesap-makinesi/", icon: "🧮", customLogo: "" },
            { id: "3", title: "Google Arama", type: "raw", repoName: "", url: "https://www.google.com/search?igu=1", icon: "🌐", customLogo: "" },
            { id: "4", title: "Wikipedia TR", type: "raw", repoName: "", url: "https://tr.wikipedia.org/", icon: "📚", customLogo: "" }
        ];

        /* ===== DURUM ===== */
        let apps = JSON.parse(localStorage.getItem("ata_apps")) || INITIAL_APPS;
        let isAdmin = localStorage.getItem("ata_admin") === "true";
        let linkType = "repo";
        let currentPage = 1;
        let lockTimer = null;
        // Tema tercihi: Kayıtlı tercih yoksa Varsayılan BEYAZ TEMA (Light Mode)
        let isDark = localStorage.getItem("ata_theme") === "dark";
        const logoCache = {};

        /* ===== TEMA YÖNETİMİ ===== */
        function applyTheme() {
            if (isDark) {
                document.body.classList.remove("light-mode");
                document.getElementById("themeBtn").innerHTML = '<i class="fa-solid fa-moon"></i>';
            } else {
                document.body.classList.add("light-mode");
                document.getElementById("themeBtn").innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
        }

        document.getElementById("themeBtn").addEventListener("click", () => {
            isDark = !isDark;
            localStorage.setItem("ata_theme", isDark ? "dark" : "light");
            applyTheme();
        });

        /* ===== KİLİT SİSTEMİ ===== */
        const getAttempts = () => parseInt(localStorage.getItem("ata_fail") || "0", 10);
        const getLockEnd = () => parseInt(localStorage.getItem("ata_lock_end") || "0", 10);
        const isLocked = () => Date.now() < getLockEnd();

        function recordFail() {
            const c = getAttempts() + 1;
            localStorage.setItem("ata_fail", c.toString());
            if (c >= MAX_ATTEMPTS) {
                localStorage.setItem("ata_lock_end", (Date.now() + LOCKOUT_SEC * 1000).toString());
                localStorage.setItem("ata_fail", "0");
                return true;
            }
            return false;
        }

        function clearLock() {
            localStorage.removeItem("ata_fail");
            localStorage.removeItem("ata_lock_end");
        }

        function startCountdown() {
            const box = document.getElementById("lockoutBox");
            const cnt = document.getElementById("lockoutCount");
            const frm = document.getElementById("authForm");

            box.style.display = "block";
            frm.style.display = "none";
            document.getElementById("authErr").style.display = "none";

            if (lockTimer) clearInterval(lockTimer);

            lockTimer = setInterval(() => {
                const rem = Math.max(0, Math.ceil((getLockEnd() - Date.now()) / 1000));
                const m = String(Math.floor(rem / 60)).padStart(2, "0");
                const s = String(rem % 60).padStart(2, "0");
                cnt.textContent = `${m}:${s}`;

                if (rem <= 0) {
                    clearInterval(lockTimer);
                    lockTimer = null;
                    box.style.display = "none";
                    frm.style.display = "block";
                    clearLock();
                }
            }, 1000);
        }

        /* ===== AUTH MODAL ===== */
        function openAuthModal() {
            document.getElementById("authModal").classList.add("active");
            document.getElementById("authErr").style.display = "none";

            if (isLocked()) {
                startCountdown();
            } else {
                document.getElementById("lockoutBox").style.display = "none";
                document.getElementById("authForm").style.display = "block";
                setTimeout(() => document.getElementById("usernameInput").focus(), 80);
            }
        }

        function closeAuthModal() {
            document.getElementById("authModal").classList.remove("active");
        }

        document.getElementById("authForm").addEventListener("submit", (e) => {
            e.preventDefault();
            if (isLocked()) {
                startCountdown();
                return;
            }

            const user = document.getElementById("usernameInput").value.trim();
            const pass = document.getElementById("passwordInput").value.trim();
            const err = document.getElementById("authErr");

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                isAdmin = true;
                localStorage.setItem("ata_admin", "true");
                clearLock();
                err.style.display = "none";
                closeAuthModal();
                updateAdminUI();
                renderApps();
                document.getElementById("authForm").reset();
            } else {
                const locked = recordFail();
                err.style.display = "block";
                if (locked) {
                    err.textContent = "Hesap kilitlendi! 10 dakika bekleyin.";
                    startCountdown();
                } else {
                    const rem = MAX_ATTEMPTS - getAttempts();
                    err.textContent = `Kullanıcı adı veya şifre hatalı! (${rem} hak kaldı)`;
                }
                document.getElementById("passwordInput").value = "";
                document.getElementById("passwordInput").focus();
            }
        });

        function adminLogout() {
            isAdmin = false;
            localStorage.removeItem("ata_admin");
            updateAdminUI();
            renderApps();
        }

        function updateAdminUI() {
            document.getElementById("adminBadge").style.display = isAdmin ? "inline-flex" : "none";
            document.getElementById("addSiteBtn").style.display = isAdmin ? "inline-flex" : "none";
            document.getElementById("loginBtn").style.display = isAdmin ? "none" : "inline-flex";
            document.getElementById("logoutBtn").style.display = isAdmin ? "inline-flex" : "none";
        }

        /* ===== LINK EKLEME MODAL ===== */
        function openAddModal() {
            document.getElementById("addModal").classList.add("active");
        }

        function closeAddModal() {
            document.getElementById("addModal").classList.remove("active");
        }

        document.getElementById("addSiteBtn").onclick = openAddModal;

        function setLinkType(t) {
            linkType = t;
            document.getElementById("repoGroup").style.display = (t === "repo") ? "block" : "none";
            document.getElementById("rawGroup").style.display = (t === "raw") ? "block" : "none";
            document.getElementById("optRepo").classList.toggle("active", t === "repo");
            document.getElementById("optRaw").classList.toggle("active", t === "raw");
        }

        document.getElementById("repoInput").addEventListener("input", (e) => {
            const v = e.target.value.trim().replace(/^\/+|\/+$/g, "");
            document.getElementById("repoPreview").textContent = v ? `${GITHUB_BASE}${v}/` : `${GITHUB_BASE}.../`;
        });

        document.getElementById("addForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const title = document.getElementById("titleInput").value.trim();
            if (!title) return;
            const icon = document.getElementById("iconInput").value.trim() || "🌐";
            const customLogo = document.getElementById("customLogoInput").value.trim();

            let finalUrl = "", repoName = "";

            if (linkType === "repo") {
                const repo = document.getElementById("repoInput").value.trim().replace(/^\/+|\/+$/g, "");
                if (!repo) return alert("Lütfen repo adı girin!");
                repoName = repo;
                finalUrl = `${GITHUB_BASE}${repo}/`;
            } else {
                finalUrl = document.getElementById("rawInput").value.trim();
                if (!finalUrl.startsWith("http")) finalUrl = "https://" + finalUrl;
            }

            apps.unshift({ id: Date.now().toString(), title, type: linkType, repoName, url: finalUrl, icon, customLogo });
            saveApps();
            currentPage = 1;
            renderApps();
            closeAddModal();
            document.getElementById("addForm").reset();
        });

        /* ===== JSONBin BULUT SYNC ===== */
        async function loadAppsFromJSONBin() {
            try {
                const res = await fetch(`${JSONBIN_URL}/latest`, {
                    headers: { "X-Master-Key": JSONBIN_KEY, "X-Access-Key": JSONBIN_KEY }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data?.record?.apps && Array.isArray(data.record.apps)) {
                        apps = data.record.apps;
                        localStorage.setItem("ata_apps", JSON.stringify(apps));
                        renderApps();
                    }
                }
            } catch (e) {
                console.warn("JSONBin bağlantı hatası:", e);
            }
        }

        async function saveApps() {
            localStorage.setItem("ata_apps", JSON.stringify(apps));
            try {
                await fetch(JSONBIN_URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY, "X-Access-Key": JSONBIN_KEY },
                    body: JSON.stringify({ apps, updatedAt: new Date().toISOString() })
                });
            } catch (e) {
                console.warn("JSONBin kaydetme hatası:", e);
            }
        }

        /* ===== LOGO ÇEKME (INDEX.HTML DETECT) ===== */
        async function fetchLogoFromIndexHTML(app) {
            if (logoCache[app.id]) return logoCache[app.id];
            if (app.customLogo?.startsWith("http")) return app.customLogo;
            if (app.icon?.startsWith("http")) return app.icon;

            const cleanUrl = (app.url || "").replace(/\/+$/, "") + "/";
            let html = "";

            if (app.type === "repo" || app.url.includes("github.io")) {
                const domain = new URL(app.url).hostname;
                const user = domain.split(".")[0] || "ata-software";
                const repo = app.repoName || app.url.split("/").filter(Boolean).pop();
                const urls = [
                    `https://raw.githubusercontent.com/${user}/${repo}/main/index.html`,
                    `https://raw.githubusercontent.com/${user}/${repo}/master/index.html`,
                    `${cleanUrl}index.html`,
                    cleanUrl
                ];
                for (const u of urls) {
                    try {
                        const r = await fetch(u);
                        if (r.ok) {
                            html = await r.text();
                            if (html) break;
                        }
                    } catch (e) { }
                }
            } else {
                try {
                    const r = await fetch(cleanUrl);
                    if (r.ok) html = await r.text();
                } catch (e) { }
            }

            if (html) {
                const re1 = /<link[^>]+rel=["']?(?:shortcut\s+icon|icon|apple-touch-icon|apple-touch-icon-precomposed)["']?[^>]+href=["']?([^"'>\s]+)["']?/gi;
                const re2 = /<link[^>]+href=["']?([^"'>\s]+)["']?[^>]+rel=["']?(?:shortcut\s+icon|icon|apple-touch-icon|apple-touch-icon-precomposed)["']?/gi;
                let m, found = null;
                while ((m = re1.exec(html))) {
                    found = m[1];
                    if (m[0].includes("apple-touch-icon") || m[0].includes("192") || m[0].includes("512")) break;
                }
                if (!found) {
                    while ((m = re2.exec(html))) {
                        found = m[1];
                        break;
                    }
                }
                if (found) {
                    if (!found.startsWith("http") && !found.startsWith("//")) {
                        found = new URL(found.replace(/^\.\//, ""), cleanUrl).href;
                    }
                    logoCache[app.id] = found;
                    return found;
                }
            }
            return `https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(app.url)}&size=128`;
        }

        function getPrimaryLogoUrl(app) {
            if (app.customLogo?.startsWith("http")) return app.customLogo;
            if (app.icon?.startsWith("http")) return app.icon;
            if (logoCache[app.id]) return logoCache[app.id];
            try {
                const cleanUrl = (app.url || "").replace(/\/+$/, "");
                const domain = new URL(app.url).hostname;
                if (app.type === "repo" || domain.includes("github.io")) {
                    const user = domain.split(".")[0] || "ata-software";
                    const repo = app.repoName || cleanUrl.split("/").pop();
                    if (user && repo) return `https://raw.githubusercontent.com/${user}/${repo}/main/icon-192.png`;
                }
                return `https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(app.url)}&size=128`;
            } catch (e) {
                return null;
            }
        }

        function handleLogoError(img, appUrl, fallbackIcon, appType, repoName) {
            try {
                const cleanUrl = appUrl.replace(/\/+$/, "");
                const domain = new URL(appUrl).hostname;
                const step = parseInt(img.dataset.step || "0", 10);
                const srcs = [];

                if (appType === "repo" || domain.includes("github.io")) {
                    const user = domain.split(".")[0] || "ata-software";
                    const repo = repoName || cleanUrl.split("/").pop();
                    if (user && repo) {
                        srcs.push(`https://raw.githubusercontent.com/${user}/${repo}/main/favicon.ico`);
                        srcs.push(`https://raw.githubusercontent.com/${user}/${repo}/main/favicon.png`);
                        srcs.push(`https://raw.githubusercontent.com/${user}/${repo}/main/logo192.png`);
                        srcs.push(`https://raw.githubusercontent.com/${user}/${repo}/main/apple-touch-icon.png`);
                        srcs.push(`https://raw.githubusercontent.com/${user}/${repo}/master/icon-192.png`);
                        srcs.push(`https://raw.githubusercontent.com/${user}/${repo}/master/favicon.ico`);
                    }
                }
                srcs.push(`${cleanUrl}/icon-192.png`, `${cleanUrl}/apple-touch-icon.png`, `${cleanUrl}/logo192.png`, `${cleanUrl}/favicon.ico`, `${cleanUrl}/favicon.png`, `${cleanUrl}/android-chrome-192x192.png`);
                srcs.push(`https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(appUrl)}&size=128`);
                srcs.push(`https://www.google.com/s2/favicons?domain=${domain}&sz=128`);
                srcs.push(`https://icon.horse/icon/${domain}`);
                srcs.push(`https://icons.duckduckgo.com/ip3/${domain}.ico`);

                if (step < srcs.length) {
                    img.dataset.step = (step + 1).toString();
                    img.src = srcs[step];
                } else {
                    img.style.display = "none";
                    if (img.nextElementSibling) img.nextElementSibling.style.display = "inline-flex";
                }
            } catch (e) {
                img.style.display = "none";
                if (img.nextElementSibling) img.nextElementSibling.style.display = "inline-flex";
            }
        }

        /* ===== TÜRKÇE DÜZELTMELİ HARF DUYARSIZ ARAMA ===== */
        function normalizeText(str) {
            if (!str) return "";
            return str
                .replace(/İ/g, "i")
                .replace(/I/g, "ı")
                .toLocaleLowerCase("tr-TR")
                .replace(/ı/g, "i")
                .replace(/ğ/g, "g")
                .replace(/ü/g, "u")
                .replace(/ş/g, "s")
                .replace(/ö/g, "o")
                .replace(/ç/g, "c");
        }

        /* ===== RENDER APPS (4x3 GRID - 12 SİTE / SAYFA) ===== */
        function renderApps(filter = "") {
            const grid = document.getElementById("appsGrid");
            const pag = document.getElementById("paginationContainer");
            grid.innerHTML = "";

            const normFilter = normalizeText(filter);
            const filtered = apps.filter(a =>
                normalizeText(a.title).includes(normFilter) ||
                normalizeText(a.repoName || "").includes(normFilter)
            );
            const total = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
            if (currentPage > total) currentPage = total;
            if (currentPage < 1) currentPage = 1;

            const items = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            if (!items.length) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2.5rem; color:var(--text-muted);">Henüz eklenmiş site bulunamadı.</div>`;
            } else {
                items.forEach(app => {
                    const card = document.createElement("div");
                    card.className = "card";
                    const logoUrl = getPrimaryLogoUrl(app);
                    const isEmoji = app.icon && !app.icon.startsWith("fa-") && !app.icon.startsWith("http");
                    const fbHtml = isEmoji ? `<span>${app.icon || '🌐'}</span>` : `<i class="fa-solid ${app.icon || 'fa-globe'}"></i>`;
                    const logoHtml = logoUrl
                        ? `<img id="li-${app.id}" src="${logoUrl}" alt="${app.title}" style="width:26px; height:26px; border-radius:6px; object-fit:contain;" onerror="handleLogoError(this, '${app.url}', '${app.icon}', '${app.type}', '${app.repoName || ''}')" /><span style="display:none;">${fbHtml}</span>`
                        : fbHtml;

                    const typeTag = app.type === "repo"
                        ? `<span class="tag repo">REPO</span>`
                        : `<span class="tag raw">HAM LİNK</span>`;

                    card.innerHTML = `
                        <div class="card-icon">${logoHtml}</div>
                        <div class="card-info">
                            <h3>${app.title}</h3>
                            ${typeTag}
                        </div>
                        <div class="card-btns">
                            <button class="btn-launch" onclick="openApp('${app.url}', '${app.title}')"><i class="fa-solid fa-play"></i> Aç</button>
                            ${isAdmin ? `<button class="btn-del" onclick="deleteApp('${app.id}')" title="Sil"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);

                    // HTML kaynak kodundan logo çekme
                    fetchLogoFromIndexHTML(app).then(url => {
                        if (url) {
                            const img = document.getElementById(`li-${app.id}`);
                            if (img && img.src !== url) img.src = url;
                        }
                    });
                });
            }

            // Sayfalama (Page 2 yoksa gizle)
            if (total > 1) {
                pag.style.display = "flex";
                pag.innerHTML = "";

                const prev = document.createElement("button");
                prev.className = "page-btn";
                prev.innerHTML = `<i class="fa-solid fa-chevron-left"></i> Önceki`;
                prev.disabled = currentPage === 1;
                prev.onclick = () => { currentPage--; renderApps(filter); };
                pag.appendChild(prev);

                for (let i = 1; i <= total; i++) {
                    const pb = document.createElement("button");
                    pb.className = `page-btn${i === currentPage ? ' active' : ''}`;
                    pb.textContent = i;
                    pb.onclick = () => { currentPage = i; renderApps(filter); };
                    pag.appendChild(pb);
                }

                const next = document.createElement("button");
                next.className = "page-btn";
                next.innerHTML = `Sonraki <i class="fa-solid fa-chevron-right"></i>`;
                next.disabled = currentPage === total;
                next.onclick = () => { currentPage++; renderApps(filter); };
                pag.appendChild(next);
            } else {
                pag.style.display = "none";
            }
        }

        function deleteApp(id) {
            if (confirm("Bu siteyi silmek istediğinize emin misiniz?")) {
                apps = apps.filter(a => a.id !== id);
                saveApps();
                renderApps();
            }
        }

        /* ===== VIEWER & AKILLI LİNK DÖNÜŞTÜRÜCÜ ===== */
        const BLOCKED_DOMAINS = ["spotify.com", "youtube.com", "youtu.be", "instagram.com", "twitter.com", "x.com", "facebook.com", "github.com"];

        function getEmbeddableUrl(rawUrl) {
            try {
                const u = new URL(rawUrl);
                const host = u.hostname.toLowerCase();

                // Spotify Dönüştürücü (Playlist / Track / Album -> Embed Player)
                if (host.includes("spotify.com")) {
                    if (u.pathname.includes("/track/") || u.pathname.includes("/playlist/") || u.pathname.includes("/album/")) {
                        return `https://open.spotify.com/embed${u.pathname}${u.search}`;
                    }
                }

                // YouTube Dönüştürücü (watch?v= -> /embed/)
                if (host.includes("youtube.com") && u.pathname.includes("/watch")) {
                    const id = u.searchParams.get("v");
                    if (id) return `https://www.youtube.com/embed/${id}`;
                } else if (host.includes("youtu.be")) {
                    const id = u.pathname.replace("/", "");
                    if (id) return `https://www.youtube.com/embed/${id}`;
                }

                return rawUrl;
            } catch (e) {
                return rawUrl;
            }
        }

        function isIframeBlocked(rawUrl) {
            try {
                const host = new URL(rawUrl).hostname.toLowerCase();
                if (host.endsWith("github.io")) return false;
                return BLOCKED_DOMAINS.some(d => host.includes(d));
            } catch (e) {
                return false;
            }
        }

        function hideViewerLoader() {
            const loader = document.getElementById("viewerLoader");
            if (loader) loader.style.display = "none";
        }

        function openApp(url, title) {
            const finalUrl = getEmbeddableUrl(url);
            const isBlocked = isIframeBlocked(url);

            // Spotify ana sayfası vb. iframe gömmeyi tamamen engelleyen (X-Frame-Options: DENY) dev siteler
            if (isBlocked && !finalUrl.includes("/embed/")) {
                window.open(url, "_blank");
                return;
            }

            document.getElementById("viewerTitle").textContent = title;
            const loader = document.getElementById("viewerLoader");
            if (loader) loader.style.display = "flex";

            const frame = document.getElementById("viewerFrame");
            frame.src = finalUrl;
            document.getElementById("viewer").classList.add("active");
            document.body.style.overflow = "hidden";

            document.getElementById("openExternal").onclick = () => window.open(url, "_blank");
        }

        document.getElementById("closeViewer").onclick = () => {
            document.getElementById("viewer").classList.remove("active");
            document.getElementById("viewerFrame").src = "";
            document.body.style.overflow = "auto";
        };

        /* ===== ARAMA İŞLEVİ ===== */
        document.getElementById("searchInput").addEventListener("input", (e) => {
            currentPage = 1;
            renderApps(e.target.value.trim());
        });

        /* ===== BAŞLATMA ===== */
        document.addEventListener("DOMContentLoaded", () => {
            applyTheme();
            updateAdminUI();
            renderApps();
            loadAppsFromJSONBin();

            // PWA Servis Çalıştırıcısı (Ana Ekrana Ekleme Desteği)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Hata:', err));
            }
        });
    </script>
</body>
